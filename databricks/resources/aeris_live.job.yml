resources:
  jobs:
    aeris_live_refresh:
      name: aeris_live_refresh
      description: Starts by itself when the live collector drops a new file → ETL pipeline → validate → sync
      tags:
        project: aeris
      performance_target: STANDARD
      max_concurrent_runs: 1
      # PAUSED = no cost until you unpause it for a demo
      trigger:
        pause_status: PAUSED
        file_arrival:
          url: /Volumes/aeris_brick/default/aeris/landing/live/
          min_time_between_triggers_seconds: 1800
          wait_after_last_change_seconds: 60
      parameters:
        - name: batch_id
          default: "{{job.run_id}}"
      tasks:
        - task_key: etl_bronze_silver_gold
          pipeline_task:
            pipeline_id: ${resources.pipelines.aeris_etl.id}
        - task_key: validate_gold
          depends_on: [{task_key: etl_bronze_silver_gold}]
          notebook_task:
            notebook_path: ../src/notebooks/05_validate_gold.py
        - task_key: sync_supabase
          depends_on: [{task_key: validate_gold}]
          notebook_task:
            notebook_path: ../src/notebooks/06_sync_supabase.py
          max_retries: 2
