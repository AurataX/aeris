resources:
  jobs:
    aeris_pipeline:
      name: aeris_pipeline
      description: AERIS run, manual — fill missing days + ingest APIs → ETL pipeline (bronze → silver → gold) → validate → sync to Supabase
      tags:
        project: aeris
      performance_target: STANDARD
      max_concurrent_runs: 1
      # manual only (no schedule): run it once on the last day, "databricks bundle run aeris_pipeline"
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      parameters:
        - name: batch_id
          default: "{{job.run_id}}"
      tasks:
        - task_key: ingest_batch
          notebook_task:
            notebook_path: ../src/notebooks/01_ingest_batch.py
          max_retries: 2
          min_retry_interval_millis: 60000
          timeout_seconds: 1800

        - task_key: backfill_openaq
          notebook_task:
            notebook_path: ../src/notebooks/02_backfill_openaq.py
          max_retries: 1
          min_retry_interval_millis: 60000
          timeout_seconds: 2400

        - task_key: etl_bronze_silver_gold
          depends_on: [{task_key: ingest_batch}, {task_key: backfill_openaq}]
          pipeline_task:
            pipeline_id: ${resources.pipelines.aeris_etl.id}

        - task_key: validate_gold
          depends_on: [{task_key: etl_bronze_silver_gold}]
          notebook_task:
            notebook_path: ../src/notebooks/05_validate_gold.py

        - task_key: sync_supabase
          depends_on: [{task_key: validate_gold}]
          notebook_task:
            notebook_path: ../src/notebooks/06_sync_supabase.py
          max_retries: 2
          min_retry_interval_millis: 60000
