resources:
  jobs:
    aeris_pipeline:
      name: aeris_pipeline
      description: AERIS run, manual — ingest APIs → ETL pipeline (bronze → silver → gold) → validate → sync to Supabase
      tags:
        project: aeris
      performance_target: STANDARD
      timeout_seconds: 3000 # hard stop at 50 min (normal run ~33 min)
      max_concurrent_runs: 1
      # manual only (no schedule). The live collector keeps landing new readings, so no backfill is needed here. Run: databricks bundle run aeris_pipeline
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      parameters:
        - name: batch_id
          default: "{{job.run_id}}"
      tasks:
        - task_key: ingest_batch
          notebook_task:
            notebook_path: ../src/notebooks/01_ingest_batch.py
          max_retries: 2
          min_retry_interval_millis: 60000
          timeout_seconds: 1800

        - task_key: etl_bronze_silver_gold
          depends_on: [{task_key: ingest_batch}]
          pipeline_task:
            pipeline_id: ${resources.pipelines.aeris_etl.id}

        - task_key: validate_gold
          depends_on: [{task_key: etl_bronze_silver_gold}]
          notebook_task:
            notebook_path: ../src/notebooks/05_validate_gold.py

        - task_key: sync_supabase
          depends_on: [{task_key: validate_gold}]
          notebook_task:
            notebook_path: ../src/notebooks/06_sync_supabase.py
          max_retries: 2
          min_retry_interval_millis: 60000
