name = "aeris-collector"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[triggers]
crons = ["*/30 * * * *", "15,45 * * * *"]

# Observability: Cloudflare keeps the Worker's logs and one log line per cron run, searchable in the dashboard.
# head_sampling_rate = 1 means keep every invocation (we only run ~96 times a day, so it is cheap).
[observability]
enabled = true
head_sampling_rate = 1

[vars]
DATABRICKS_HOST = "https://adb-7405619537081466.6.azuredatabricks.net"

# secrets (set with `npx wrangler secret put <NAME>`): DATABRICKS_CLIENT_ID, DATABRICKS_CLIENT_SECRET,
# OPENAQ_API_KEY, DATA_GOV_IN_API_KEY

# data.gov.in (CPCB) refuses Cloudflare's overseas servers (error 521). Run the Worker near Mumbai instead.
[placement]
region = "aws:ap-south-1"
